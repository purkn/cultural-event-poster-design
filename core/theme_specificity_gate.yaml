version: 0.13
purpose: 防止“换活动名仍成立”的通用概念，也防止用文案夸大专属性。
requirements:
  structural_bindings_min: 2
binding_types:
  - event_content_or_ritual
  - venue_or_city
  - title_language_structure
  - key_asset
  - audience_behavior
  - brand_identity
  - time_or_season
swap_test:
  instruction: 将活动替换成最邻近的另一个活动类型，判断视觉机制是否仍可原样使用。
  penalty_if_unchanged: 8
forbidden_claims:
  - unsupported_uniqueness
  - "only belongs to X without structural evidence"
