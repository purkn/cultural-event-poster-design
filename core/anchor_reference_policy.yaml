version: 0.13
policy: lead_reference_controls_whole_design_personality; style anchors remain quality comparators
rules:
  - bind_one_lead_reference_per_route_when_available
  - optional_support_reference_max_1
  - compare_style_maturity_against_3_to_5_style_anchors_after_rough_generation
