version: 0.15
priority: hard_gate
name: CHINESE_TYPOGRAPHY_GATE
applicable_to: all_style_packs
required_stages:
  - reference_type_blueprint
  - font_file_provenance
  - glyph_coverage_for_exact_text
  - proof_for_each_candidate
  - typography_reference_comparison
  - browser_load_evidence
  - screenshot_zh_en
hard_fail:
  - unknown_selected_font_file
  - missing_glyphs_in_h0
  - unsupported_synthesized_font_weight
  - title_uses_unverified_fallback
  - custom_display_reference_reduced_to_default_system_font
  - type_visual_delta_red
  - wrong_characters_or_variant
  - title_collides_with_information
needs_more_evidence:
  - font_load_unverified
  - browser_screenshot_missing
  - no_type_proof
no_false_claims:
  - image_screenshot_does_not_prove_fallback
  - font_name_string_does_not_prove_font_loaded
  - no_effect_does_not_imply_good_typography
  - fonttools_cmap_check_does_not_prove_good_glyph_shapes
