version: 0.13
purpose: reject good illustrations that are weak posters
tests:
  thumbnail_25_percent:
    pass_if: dominant_visual_mechanism_is_still_obvious
  two_second_test:
    pass_if: viewer_can_identify_the_main_trick_without_reading_body_copy
  mass_count:
    target: 1_to_3_major_visual_masses
  H0_role:
    pass_if: H0_location_and_behavior_are_clear
  detail_dependency:
    fail_if: concept_only_works_through_many_small_story_details
  silhouette:
    pass_if: poster_has_a_memorable_overall_shape_or_weight_distribution
hard_fail:
  - storybook_scene_with_no_poster_structure
  - too_many_equal_focal_points
  - H0_added_later_as_a_label
  - concept_disappears_when_viewed_small
