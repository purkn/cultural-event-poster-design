version: 0.13
promote_reference_cluster_to_style_pack_when:
  min_positive_refs: 8
  min_core_anchors: 4
  internal_visual_coherence_min: 0.72
  router_profile_can_be_defined: true
  asset_affinity_can_be_defined: true
  regression_cases_min: 4
  failure_cases_min: 2
  no_single_reference_dominates: true
otherwise:
  status: reference_cluster_only
  usage: auxiliary_anchor_or_retrieval_source
