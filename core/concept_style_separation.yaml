version: 0.13
principle: separate variables when diagnosing, but autonomous production may compare full routes
modes:
  production_route_competition:
    candidates_may_vary:
      - style_pack
      - substyle
      - visual_concept
      - asset_transform
      - H0_strategy
    requirement:
      - each route is decomposed and scored on explicit dimensions
      - style quality is normalized against that style's own anchors
  diagnostic_concept_test:
    fixed: [style_pack, substyle, anchors, palette_logic, mark_language, materiality]
    variable: [visual_concept]
  diagnostic_style_test:
    fixed: [visual_concept, core_subject_relationship, information_goal]
    variable: [style_pack, substyle]
hard_fail:
  - cross_style_comparison_without_normalization
  - route_choice_based_only_on_event_type
