version: 0.13
policy: 素材先判断“能做什么”，再决定是否进入海报。
levels: [PRESERVE, ADAPT, TRANSFORM, IGNORE]
assessment:
  semantic_value: 0-10
  visual_quality: 0-10
  uniqueness: 0-10
  transformability: 0-10
  identity_constraint: 0-10
possible_roles:
