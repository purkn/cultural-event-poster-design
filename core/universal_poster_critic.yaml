version: 0.20.2
purpose: context-led visual review; no alternate scoring scale
score_source: core/design_quality_scores.yaml
required_design_read: [event, audience, channel, visual_intent, reference_basis]
required_observations: [text_over_subject, font_personality, type_hierarchy, thumbnail_readability, hero_visual_integrity]
required_artifacts: [final_render, thumbnail, reference_comparison, typography_proof, reference_blueprint, poster_plan]
preflight_checks:
  - brief_and_audience_fit
  - reference_fidelity
  - visible_concept_and_theme_specificity
  - typography_and_type_image_craft
  - composition_hierarchy_and_density
  - palette_and_material_coherence
  - factual_and_bilingual_accuracy
  - output_and_evidence_integrity
anti_default_checks:
  - generic_theme_symbols
  - decorative_labels_and_microcopy
  - default_palette_or_font_without_reference_basis
  - unnecessary_effects_or_template_composition
pattern_verdicts: [ABSENT, JUSTIFIED, REWORK]
principles:
  - audience_brand_and_lead_decide_style_not_reviewer_preference
  - suspected_patterns_are_contextual_not_global_color_font_or_symmetry_bans
  - justify_exception_with_brief_reference_or_structural_function
  - all_required_checks_must_pass_and_no_issue_may_remain_open
  - after_change_re_render_and_re_review_current_artifacts
