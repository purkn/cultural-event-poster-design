version: 0.13
comparison_set:
  lead_reference_required_when_available: true
  style_anchor_refs_min: 2
  style_anchor_refs_max: 4
questions:
  - Does the rough preserve a coherent design personality comparable to the lead?
  - Is the rough more generic or safer than the lead/anchors?
  - Is the H0 less designed or less integrated than the lead/anchors?
  - Is the concept visible in structure, not only surface effects?
  - Does the composition have comparable scale tension and negative-space intention?
hard_fail_flags:
  - looks_more_generic_than_references
  - looks_like_safe_student_exercise
  - H0_feels_interchangeable
  - concept_is_only_decorative
output:
  - pass
  - failed_flags
  - visible_evidence
  - three_design_differences
  - target_module
