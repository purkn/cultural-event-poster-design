version: 0.13
shortcuts:
  TOPOLOGY_ONLY_LEAD:
    detect: [topology_high_but_medium_type_palette_low]
    action: downgrade_to_structure_only_or_reselect
  SUPPORT_OVERRIDE:
    detect: [support_changes_two_or_more_global_dimensions]
    action: hard_fail_lead_dominance
  ARTWORD_EFFECT:
    detect: [gradient_glow_outline_or_texture_added_only_for_artword_status]
    action: hard_fail_H0
  IMMERSIVE_GLOW:
    detect: [immersive_or_digital_brief_causes_black_multicolor_glow_without_reference]
    action: hard_fail_surface
  SAFE_INSTITUTIONAL_TEMPLATE:
    detect: [formal_event, beige_border_serif_rect_image_columns]
    action: apply_safe_template_penalty
  PLAIN_H0:
    detect: [default_font_without_reference_DNA_analysis]
    action: hard_fail_H0
  THEME_NOUN_CHECKLIST:
    detect: [multiple_literal_theme_objects_without_single_visual_mechanism]
    action: return_to_concept
  POST_HOC_CONCEPT:
    detect: [concept_can_be_removed_without_structural_change]
    action: hard_fail_concept
  MULTI_REFERENCE_AVERAGING:
    detect: [three_or_more_references_without_lead_or_single_problem_support]
    action: require_lead_reference
  COVERAGE_GAP_MASHUP:
    detect: [mix_multiple_style_families_because_coverage_is_low]
    action: require_single_personality_per_route
  ONE_ROUGH:
    detect: [rough_count_below_policy]
    action: reject_finalization
  TECHNICAL_QC_INFLATION:
    detect: [high_total_claim_based_on_mechanical_quality]
    action: separate_design_and_production_scores
  NO_VISUAL_EVIDENCE:
    detect: [design_pass_without_actual_image_inspection]
    action: cap_design_score_60
  ASSET_AS_IS:
    detect: [non_preserve_asset_placed_without_affordance_decision]
    action: return_to_asset_audit
