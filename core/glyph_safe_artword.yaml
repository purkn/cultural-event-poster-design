version: 0.13
purpose: preserve exact Chinese H0 when the chosen typography strategy requires custom lettering
priority: conditional_by_typography_strategy_router
pipeline:
  step_1_exact_skeleton:
    action: render exact H0 text with real glyphs in SVG/HTML/vector form
  step_2_reference_DNA:
    define:
      - stroke_contrast
      - weight
      - width
      - vertical_proportion
      - arrangement
      - fill_behavior
      - effect_class
  step_3_structural_art_direction:
    define:
      - per_character_proportion
      - deformation_logic
      - spatial_relationship
      - image_type_relationship
  step_4_controlled_stylization:
    preferred_methods:
      - vector_deformation_from_exact_glyph_base
      - image_edit_using_exact_glyph_skeleton_as_reference
      - hybrid_vector_plus_generated_marks
  step_5_proof:
    action: character_by_character_visual_check
forbidden:
  - freeform_chinese_text_generation_without_exact_skeleton
  - accepting_fake_characters
  - adding_gradient_or_glow_only_to_prove_artword_status
  - overriding_lead_typography_DNA
note: >
  If Lead uses refined editorial display typography, do not force this pipeline. Use REFERENCE_LED_DISPLAY_TYPE instead.
