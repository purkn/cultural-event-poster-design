version: 0.13
strategy_router_required: true
required_fields:
  - H0_skeleton_class
  - H0_stroke_contrast
  - H0_weight
  - H0_width
  - H0_vertical_proportion
  - H0_arrangement
  - H0_fill_behavior
  - H0_effect_class
  - body_personality
  - english_personality
  - numeric_style
  - alignment
  - tracking
  - line_height
  - label_value_hierarchy
rules:
  - choose H0 mode from lead typography before stylization
  - body font may not default to system font without design reason
  - english must share hierarchy logic with Chinese
  - numeric/date styling is part of system
  - reference_led_display_type is valid design when lead uses editorial typography
hard_red:
  - H0_weight_delta_gte_2
  - H0_contrast_class_reversal
  - flat_to_gradient_or_glow_without_reference_evidence
  - single_color_to_multicolor_without_reference_evidence
  - refined_editorial_to_handmade_without_reference_evidence
