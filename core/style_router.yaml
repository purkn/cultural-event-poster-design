version: 0.13
mode: multi_candidate_after_lead_evidence
weights:
  lead_reference_evidence: 17
  asset_affordance_fit: 16
  theme_tone_fit: 14
  visual_opportunity_fit: 13
  H0_artword_fit: 10
  information_density_fit: 8
  audience_communication_fit: 8
  bilingual_fit: 5
  format_channel_fit: 4
  generation_reliability: 3
  coverage_confidence: 2
thresholds:
  candidate_min: 60
  single_route_score: 82
  single_route_margin: 12
rules:
  - style routing happens after brief, asset audit, visual opportunity map, and reference retrieval
  - never route only by event_type
  - formal_event_does_not_imply_minimal_editorial
  - low_coverage_does_not_allow_multi_style_average
  - explicit project references may create temporary project_style candidate
