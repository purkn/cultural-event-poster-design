version: 0.13
applies_when: typography_strategy in [GLYPH_SAFE_ARTWORD, IMAGE_INTEGRATED_H0]
objective: test whether custom lettering is specific to the theme and reference, not merely decorative
score_100:
  readability: 20
  thematic_structure: 20
  reference_DNA_match: 20
  image_word_relationship: 15
  rhythm_and_scale: 10
  material_match: 10
  color_logic: 5
interchangeability_test:
  question: If the title were replaced with an unrelated title, would the same treatment work unchanged?
  if_yes:
    cap_score: 60
minimum_pass: 75
note: REFERENCE_LED_DISPLAY_TYPE is evaluated by H0_REFERENCE_FIDELITY_GATE instead of this artword test.
